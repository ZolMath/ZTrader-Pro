[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="ztrader"
version="0.2.0"
requires-python=">=3.12"
dependencies=["PySide6>=6.7,<7", "pydantic>=2.0,<3"]

[project.optional-dependencies]
mt5=["MetaTrader5>=5.0.45"]
dev=["pytest>=8"]

[tool.pytest.ini_options]
pythonpath=["src"]
addopts="-q"
